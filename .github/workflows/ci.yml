name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck, test and build
        run: npm run check
      - name: Verify release package contents
        run: npm run check:release
      - name: Pack the verified build
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          npm pack --ignore-scripts --json --pack-destination release-artifacts > release-artifacts/pack-manifest.json
      - name: Save the installable package
        uses: actions/upload-artifact@v7
        with:
          name: npm-package-${{ github.sha }}
          path: |
            release-artifacts/*.tgz
            release-artifacts/pack-manifest.json
          if-no-files-found: error
          retention-days: 14
